     Directions deja prises : plateau sombre (Zapier), bloc-notes orange (BPA), tableau periodique clair (open source),
     plan d'architecte bleu (low code), carte de randonnee creme (cloud).
     Servir la racine du depot puis ouvrir
     /_meeeters/visuels/best-ai-automation-tools-small-businesses.html        (og : titre + jeu de cartes)
     /_meeeters/visuels/best-ai-automation-tools-small-businesses.html#art    (carte et figure : jeu de cartes plein cadre)
     Les jauges traduisent les mots du tableau (Very easy = 5, Moderate = 3, More technical = 2...), pas des mesures.

<link rel="stylesheet" href="../../site/assets/fonts/fonts.css">
<style>
:root { --ink: #1D1233; --soft: #5B4F73; --card: #FBF7EF; --lilac: #CDBDF2; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #24163F; }
body { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

.stage { position: relative; width: 1200px; height: 630px; overflow: hidden;
  background: radial-gradient(70% 90% at 62% 45%, #4A2C86 0%, #2E1C55 55%, #1E1236 100%); }
.stage::before { content: ""; position: absolute; inset: 0; opacity: .5;

.view { position: absolute; inset: 0; display: none; }
.og .view-og, .art .view-art { display: block; }
.deck { position: absolute; width: 1000px; height: 520px; transform-origin: 0 0; }

.tc { position: absolute; width: 300px; height: 418px; padding: 14px 14px 12px; border-radius: 22px; background: var(--card);
  border: 3px solid var(--ink); box-shadow: 0 30px 50px -18px rgba(10, 4, 26, .75), 0 2px 0 rgba(255, 255, 255, .7) inset; }
.tc .top { display: flex; align-items: baseline; justify-content: space-between; }
.tc .name { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: -.03em; }
.tc .kind { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tone); }
.tc .art { position: relative; margin-top: 10px; height: 128px; border-radius: 12px; border: 2.5px solid var(--ink); background: linear-gradient(135deg, var(--g1), var(--g2)); overflow: hidden; }
.tc .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tc .stats { margin-top: 14px; display: grid; gap: 9px; }
.tc .row { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 700; }
.tc .bar { display: flex; gap: 4px; }
.tc .bar i { width: 24px; height: 13px; border-radius: 3px; background: #E4DCCB; }
.tc .bar i.on { background: var(--tone); }
.tc .price { margin-top: 12px; padding: 8px 10px; border-radius: 9px; background: #EFE7D6; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--ink); white-space: nowrap; }
.tc .price b { color: var(--tone); }
.tc .best { margin-top: 10px; font-size: 15px; line-height: 1.3; color: var(--soft); font-weight: 600; }
.tc .best b { color: var(--ink); }

.zap { --tone: #C2410C; --g1: #FDBA74; --g2: #F97316; left: 8px; top: 62px; transform: rotate(-6deg); }
.mak { --tone: #1D4ED8; --g1: #7DD3FC; --g2: #3B82F6; left: 350px; top: 26px; z-index: 2; }
.n8n { --tone: #BE123C; --g1: #FDA4AF; --g2: #F43F5E; left: 692px; top: 62px; transform: rotate(6deg); }

.label { position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--lilac); }

/* carte et figure */
.art .deck { left: 100px; top: 70px; }
/* og */
.og .deck { left: 580px; top: 164px; transform: scale(.6); }
.copy { position: absolute; left: 62px; top: 96px; width: 520px; color: #FFFFFF; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #FFFFFF; padding: 8px 15px 8px 13px; border: 1.5px solid rgba(205, 189, 242, .55); border-radius: 100px; background: rgba(30, 18, 54, .6); }
.eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: #F97316; }
h1 { margin-top: 22px; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 54px; line-height: 1.05; letter-spacing: -.035em; }
h1 em { font-style: normal; color: #FDBA74; }
.brand { position: absolute; left: 64px; bottom: 56px; }
.brand img { display: block; height: 32px; width: auto; }
</style>
