<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visuel - ibm-intelligent-automation</title>
<!-- Source du visuel de l'article « IBM Intelligent Automation or a Lighter Stack: A Guide for SMEs » :
     un port en papier decoupe au couchant, tons terracotta et peche. A quai sous deux grues, un porte-conteneurs
     charge de conteneurs Workflow, Decisions, Content, Documents, RPA (les briques d'une plateforme d'entreprise) ;
     au premier plan, un petit voilier avec une seule personne a bord quitte le port. La these de l'article : une
     plateforme d'entreprise est un cargo, il lui faut un port et un equipage ; une PME a besoin d'un bateau qu'elle
     mene seule. Aucun logo ni nom de marque dans l'image.
     Directions deja prises : voir (C) Journal du blog (coffre, 01 site OptimizIA.xyz).
     Servir la racine du depot puis ouvrir
     /_meeeters/visuels/ibm-intelligent-automation.html        (og : titre + scene)
     /_meeeters/visuels/ibm-intelligent-automation.html#art    (carte et figure : scene seule)
     Le visuel s'affiche a ~600 px de large : tout texte fait au moins 14 px dans le canevas de 1200.
     Aplats et degrades lisses seulement, ombres portees des couches de papier : pas de grain (poids du WebP). -->
<link rel="stylesheet" href="../../site/assets/fonts/fonts.css">
<style>
:root { --ink: #4A1E10; --soft: #8A4428; --cream: #FCEFE2; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #F2C7A5; }
body { font-family: 'Outfit', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.stage { position: relative; width: 1200px; height: 630px; overflow: hidden; }
.og .only-art, .art .only-og { display: none; }
.mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.brand { position: absolute; left: 48px; top: 40px; z-index: 2; }
.brand img { height: 38px; display: block; }
.copy { position: absolute; left: 48px; top: 104px; width: 600px; z-index: 2; }
.copy h1 { font-weight: 800; font-size: 52px; line-height: 1.02; letter-spacing: -.03em; }
.copy .mono { display: block; margin-top: 16px; font-size: 15px; color: var(--soft); }
.scene { position: absolute; left: 0; top: 0; }
svg text { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: .06em; }
</style>
</head>

<script>
/* Vagues : bandes de papier ondulees, crete a la hauteur y, amplitude a, longueur d'onde L, dephasage d. */
function vague(y, a, L, d) {
  var p = 'M0 630 V' + y, x = -d;
  while (x < 1200) { p += ' Q' + (x + L / 4) + ' ' + (y - a) + ' ' + (x + L / 2) + ' ' + y + ' T' + (x + L) + ' ' + y; x += L; }
  return p + ' V630z';
}
document.getElementById('mer1').setAttribute('d', vague(398, 6, 180, 40));
document.getElementById('mer2').setAttribute('d', vague(462, 9, 230, 90));
document.getElementById('mer3').setAttribute('d', vague(508, 11, 260, 20));
document.getElementById('mer4').setAttribute('d', vague(556, 13, 300, 150));
document.getElementById('mer5').setAttribute('d', vague(598, 12, 340, 60));
if (location.hash === "#art") document.getElementById("stage").className = "stage art";
</script>
