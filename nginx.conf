server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/html text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_min_length 256;

    # Detection de langue sur la racine
    location = / {
        set $lang fr;
        if ($http_accept_language ~* '^en') {
            set $lang en;
        }
        return 301 /$lang/index.html;
    }

    # Deduplication /fr/ et /en/ : une seule forme canonique
    location = /fr/ { return 301 /fr/index.html; }
    location = /en/ { return 301 /en/index.html; }

    # benefices.html a ete fusionnee dans la home le 11/08
    location = /fr/benefices.html { return 301 /fr/index.html#leviers; }
    location = /en/benefices.html { return 301 /en/index.html#leviers; }

    # Assets versionnes par empreinte : cache long et immuable
    location ~* ^/assets/(css|fonts|vendor)/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images et autres assets statiques : 30 jours
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # HTML et fichiers de seed : 1 heure, revalidation ensuite
    location ~* \.(html|txt|xml|json)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
