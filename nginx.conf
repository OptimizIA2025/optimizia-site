server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;
    server_tokens off;
    absolute_redirect off;

    # Page d'erreur du site (26/09) : un seul fichier pour le 404 et le 410,
    # le code d'origine est conserve. Elle est servie a n'importe quelle
    # profondeur d'URL, d'ou ses chemins tous absolus. Sans elle, nginx
    # repondait sa page brute.
    error_page 404 410 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Piliers SEO et GEO supprimes le 26/09 : l'agence se positionne sur
    # l'automatisation IA sur mesure, plus sur le referencement. 410 plutot que
    # 404 (Google desindexe plus vite une page declaree partie pour de bon) et
    # plutot qu'une 301 vers l'accueil, qu'il traite comme un 404 deguise.
    # Les anciennes pages de blog de SEOPlus, qui renvoyaient ici, pointent
    # desormais vers l'accueil de l'outil.
    location = /seo { return 410; }
    location = /geo { return 410; }
    location ^~ /seo/ { return 410; }
    location ^~ /geo/ { return 410; }

    # Les quatre piliers de guides IA sortent a leur tour le 26/09 (fondamentaux,
    # integration, automatisation des processus, prix et ROI) : memes raisons,
    # meme reponse. Restent les silos /case-studies/, /tools/ et /blog/.
    location = /ai-fundamentals { return 410; }
    location = /ai-integration { return 410; }
    location = /process-automation { return 410; }
    location = /pricing-roi { return 410; }
    location ^~ /ai-fundamentals/ { return 410; }
    location ^~ /ai-integration/ { return 410; }
    location ^~ /process-automation/ { return 410; }
    location ^~ /pricing-roi/ { return 410; }

    # Canonicalisation d'hote. Elle est faite ici, et non dans Caddy, pour
    # trois raisons : elle est versionnee avec le site, elle est testable au
    # build, et elle repond 301 la ou Coolify repondait 302 sur l'apex (une
    # 302 ne transmet pas le signal de canonicalisation).
    #
    # LWS cree un enregistrement A pour mta-sts.optimizia.xyz (politique
    # MTA-STS du courrier) et un autre pour son www. Les quatre hotes sont
    # declares sur l'application Coolify et ce serveur ecoute en
    # server_name _ : le site COMPLET etait donc servi sur
    # www.mta-sts.optimizia.xyz, ou Google avait crawle des pages le 08/08/2026.
    # Un canonique empeche l'indexation, pas le crawl.
    #
    # Le chemin de la politique MTA-STS est exempte : la spec interdit toute
    # redirection dessus, et c'est precisement ce qui la rend inoperante tant
    # que Caddy prefixe www.
    #
    # Liste explicite plutot que "tout hote different de www" : le controle de
    # sante de Coolify appelle le conteneur par son IP, il ne doit pas etre
    # redirige.
    set $hote_parasite 0;
    if ($host ~* ^(optimizia\.xyz|(www\.)?mta-sts\.optimizia\.xyz)$) { set $hote_parasite 1; }
    if ($request_uri = "/.well-known/mta-sts.txt") { set $hote_parasite 0; }
    if ($hote_parasite) { return 301 https://www.optimizia.xyz$request_uri; }

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/html text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_min_length 256;

    # Racine = anglais (posture internationale). Servie en 200 direct : chaque
    # backlink vers le domaine nu arrive sans redirection.
    #
    # V6.1, 28/08 : une seule version de chaque page, ecrite en anglais. Les
    # quatre langues sont appliquees au rendu par assets/oia-i18n.js, sans
    # changer d'URL. Il n'y a donc plus de hreflang : avec une seule adresse
    # par page il n'y a pas d'alternative a declarer, et Google n'indexe que
    # l'anglais. C'est un choix, pas un oubli.
    # Toujours aucune redirection serveur par Accept-Language : elle enfermerait
    # Googlebot, qui crawle depuis des IP US, dans une seule langue.
    # try_files sert le fichier dans ce contexte, sans redirection interne :
    # un "return 301 /" sur /index.html combine a la directive index
    # boucherait sinon en boucle de redirections.
    location = / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    # $is_args$args sur chaque 301 : nginx ne reattache pas la chaine de
    # requete a un return, et sans lui une redirection efface les utm_*
    # d'une campagne en silence. Mesure et correction du 21/08.
    location = /index.html { return 301 /$is_args$args; }

    # Le silo francais a ete retire le 28/08 (V6.1) : chaque page francaise part
    # vers son equivalent anglais, ou le visiteur retrouve sa langue par le
    # selecteur. Ces 301 sont definitives, les adresses /fr/ ont ete indexees
    # pendant un an et restent citees par des liens entrants.
    # Les correspondances exactes passent avant le prefixe ^~ place en dernier.
    location = /fr/ { return 301 /$is_args$args; }
    location = /fr/index.html { return 301 /$is_args$args; }
    location = /fr/apropos.html { return 301 /about.html$is_args$args; }
    location = /fr/audit-ia.html { return 301 /$is_args$args; }
    location = /fr/agence-ia-pme.html { return 301 /$is_args$args; }
    location = /fr/agence-n8n.html { return 301 /$is_args$args; }
    location = /fr/realisations.html { return 301 /case-studies/$is_args$args; }
    location = /fr/realisation-formation-ia.html { return 301 /case-studies/ai-training/$is_args$args; }
    location = /fr/realisation-reporting-automatise.html { return 301 /case-studies/automated-reporting/$is_args$args; }
    location = /fr/realisation-veille-prospection.html { return 301 /case-studies/lead-monitoring/$is_args$args; }
    location = /fr/realisation-seoplus.html { return 301 /case-studies/seoplus/$is_args$args; }
    location = /fr/realisation-sites-vitrines.html { return 301 /case-studies/showcase-websites/$is_args$args; }
    location = /fr/contact.html { return 301 /contact.html$is_args$args; }
    location = /fr/mentions-legales.html { return 301 /legal-notice.html$is_args$args; }
    location = /fr/outils.html { return 301 /tools/$is_args$args; }

    # Les guides ont retrouve un equivalent le 29/08 : traduits en anglais et
    # reintegres au modele a fichier unique. Chaque ancienne adresse part vers
    # SA traduction, ce qui est le meilleur cas pour une 301 : meme contenu.
    # (Du 28 au 29/08 ils pointaient vers la page thematique la plus proche.)
    # guides.html pointait vers le pilier /seo/ : 410 avec lui depuis le 26/09.
    location = /fr/guides.html { return 410; }
    location = /fr/guide-rag-pme.html { return 301 /$is_args$args; }
    location = /fr/guide-n8n-vs-make.html { return 301 /$is_args$args; }
    location = /fr/guide-automatiser-processus-pme.html { return 301 /$is_args$args; }

    # Pilier /tools/ : la page d'entree vers les outils est servie par CE
    # conteneur. Tout ce qui commence par /tools/seoplus part au conteneur
    # SEOPlus via les labels Caddy, ce bloc ne le voit jamais passer.
    # Meme montage qu'a la racine : try_files sert le fichier sans redirection
    # interne, sinon la directive index et le 301 ci-dessous bouclent.
    location = /tools/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /tools/index.html =404;
    }
    location = /tools/index.html { return 301 /tools/$is_args$args; }

    # ------------------------------------------------------------------
    # Restructuration en silos du 29/08/2026 : le site repart d'une base
    # propre (accueil, about, contact, Beziers, legales) plus les silos
    # /tools/, /case-studies/, /seo/ et /geo/. Les pages de services et les
    # guides sortent, les etudes de cas passent en repertoires. Chaque
    # adresse supprimee part vers son equivalent exact quand il existe,
    # sinon vers l'accueil.
    # ------------------------------------------------------------------
    location = /guides.html { return 410; }
    location = /rag-for-smes.html { return 301 /$is_args$args; }
    location = /n8n-vs-make.html { return 301 /$is_args$args; }
    location = /automate-sme-processes.html { return 301 /$is_args$args; }
    location = /ai-audit.html { return 301 /$is_args$args; }
    location = /ai-integration-agency.html { return 301 /$is_args$args; }
    location = /n8n-agency.html { return 301 /$is_args$args; }
    location = /case-studies.html { return 301 /case-studies/$is_args$args; }
    location = /case-study-ai-training.html { return 301 /case-studies/ai-training/$is_args$args; }
    location = /case-study-automated-reporting.html { return 301 /case-studies/automated-reporting/$is_args$args; }
    location = /case-study-lead-monitoring.html { return 301 /case-studies/lead-monitoring/$is_args$args; }
    location = /case-study-seoplus.html { return 301 /case-studies/seoplus/$is_args$args; }
    location = /case-study-showcase-websites.html { return 301 /case-studies/showcase-websites/$is_args$args; }
    # L exemplaire de rapport SOI est une piece jointe de demonstration, pas une
    # page : il vit sous assets/examples, et robots.txt interdit ce seul chemin
    # pour qu aucun crawler n en fasse un silo (meeeters regroupe par premier
    # segment d URL tout HTML atteignable, noindex ou pas).
    location = /reporting-pics/SOI_W2621_ANONYMIZED_SHOWCASE.html { return 301 /assets/examples/example-report.html; }
    location = /assets/examples/automated-reporting-sample.html { return 301 /assets/examples/example-report.html; }
    location = /case-studies/automated-reporting/example-report.html { return 301 /assets/examples/example-report.html; }
    # les racines de silo sans barre finale : le repertoire existe, nginx
    # ajoute la barre lui-meme (absolute_redirect off), rien a declarer.


    # benefices.html portait les 3 leviers : ils vivent sur /levers.html depuis le 31/08
    # (la home est redevenue un recit court a T-092).
    location = /fr/benefices.html { return 301 /levers.html$is_args$args; }

    # L'anglais vivait sous /en/ jusqu'a la V5.8 : 301 exactes puis filet.
    # Les correspondances exactes passent avant le prefixe ^~.
    location = /en/ { return 301 /$is_args$args; }
    location = /en/index.html { return 301 /$is_args$args; }
    location = /en/apropos.html { return 301 /about.html$is_args$args; }
    location = /en/contact.html { return 301 /contact.html$is_args$args; }
    location = /en/mentions-legales.html { return 301 /legal-notice.html$is_args$args; }
    location = /en/benefices.html { return 301 /levers.html$is_args$args; }
    location ^~ /en/ { return 301 /$is_args$args; }

    # Filet du silo francais : toute adresse /fr/ non nommee ci-dessus tombe sur
    # l'accueil plutot que sur un 404. Place apres les correspondances exactes,
    # qui restent prioritaires quel que soit l'ordre du fichier.
    location ^~ /fr/ { return 301 /$is_args$args; }

    # Assets versionnes par empreinte : cache long et immuable
    location ~* ^/assets/(css|fonts|vendor)/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Dictionnaires de langue, scripts maison et feuille de style : une heure,
    # puis revalidation.
    #
    # Volontairement PAS de cache long, alors que le moteur les appelle avec un
    # ?v= : le jour ou une traduction est corrigee sans que VERSION soit bumpe
    # dans oia-i18n.js, un cache d'un an servirait l'ancien texte pendant un an,
    # sans le moindre symptome visible. Le meme piege a coute une annee de
    # dictionnaire perime sur romainben.cloud. Une revalidation coute un 304 de
    # quelques octets, le dictionnaire le plus lourd du site faisant 35 Ko une
    # fois compresse.
    #
    # site.css est joint le 28/08 : il vit a la racine d'assets/, donc hors du
    # bloc assets/(css|fonts|vendor)/ juste au-dessus, et il ne portait aucun
    # Cache-Control (mesure en production le meme jour). Un fichier sans
    # directive est laisse a l'heuristique du navigateur, qui le garde d'autant
    # plus longtemps qu'il est ancien : une refonte pouvait donc ne jamais
    # atteindre un visiteur deja venu.
    location ~* ^/(i18n/.*\.js|assets/oia-.*\.js|assets/site\.css)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Images et autres assets statiques : 30 jours
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # HTML et fichiers de seed : 1 heure, revalidation ensuite
    location ~* \.(html|txt|xml|json)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
