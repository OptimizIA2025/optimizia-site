add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
# Clarity : le joker *.clarity.ms est obligatoire en script-src ET connect-src.
# La balise www.clarity.ms/tag/<id> n'est qu'une amorce, elle charge ensuite
# scripts.clarity.ms/<version>/clarity.js puis <region>.clarity.ms/collect.
# Une CSP incomplete ne fait pas echouer le traceur, elle le rend MUET : le tag
# s'insere, la requete est bloquee, le tableau de bord reste vide, aucun
# symptome cote site. img-src n'a rien a ouvrir tant que ad_Storage est refuse.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://n8n.romainben.cloud https://n8n.optimizia.xyz https://www.googleapis.com https://accounts.google.com https://*.clarity.ms https://c.bing.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://n8n.optimizia.xyz; object-src 'none'; upgrade-insecure-requests" always;
